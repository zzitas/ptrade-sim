[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ptrade-sim"
version = "1.0.0"
description = "PTrade 本地模拟/回测环境:事件驱动引擎 + 通达信真实行情 + Tkinter 图形界面"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xquant" }]
keywords = ["ptrade", "backtest", "quant", "etf", "tdx"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=1.3",
    "pytdx>=1.72",
]

[project.optional-dependencies]
dev = ["build"]

[project.scripts]
ptrade-gui = "ptrade_sim.gui:main"
ptrade-run = "ptrade_sim.run:main"
ptrade-selftest = "ptrade_sim._selftest:main"
ptrade-prefetch = "ptrade_sim.prefetch:main"

[tool.setuptools]
packages = ["ptrade_sim"]
